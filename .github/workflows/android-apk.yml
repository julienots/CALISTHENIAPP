name: APK Android

on:
  push:
    branches: ['**']
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Dépendances
        run: npm ci

      - name: Tests (générateur, rangs, analyseur, données)
        run: npm test

      - name: Build web + synchro Android
        run: npm run android:sync

      - name: Compilation de l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GRAVITAS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GRAVITAS-apk
          path: app/GRAVITAS.apk

      - name: Publication (branche main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GRAVITAS v1.0.${{ github.run_number }}
          files: app/GRAVITAS.apk
          body: APK Android de GRAVITAS. Télécharge GRAVITAS.apk et installe-le sur ton téléphone.
